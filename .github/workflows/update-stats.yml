name: Update download stats

on:
  schedule:
    - cron: "17 6 * * *"
  release:
    types: [published]
  repository_dispatch:
    types: [engine-release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Regenerate static download links and stats
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_REPO: Cheetahbrawl291/FNFCheetahEngine
        run: |
          set -euo pipefail
          gh api "repos/$ENGINE_REPO/releases/latest" > release.json
          python3 scripts/update-stats.py release.json
          rm release.json

      - name: Commit refreshed files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html stats.txt stats/index.html
          if git diff --cached --quiet; then
            echo "Stats unchanged"
          else
            git commit -m "chore: refresh download stats"
            git push origin main
          fi
